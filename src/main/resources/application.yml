spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/banking}
    username: ${DATABASE_USER:banking}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:9000}
server:
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
fineract:
  enabled: ${FINERACT_ENABLED:false}
  url: ${FINERACT_URL:https://localhost:8443/fineract-provider/api/v1}
  tenant: ${FINERACT_TENANT:default}
  username: ${FINERACT_USERNAME:}
  password: ${FINERACT_PASSWORD:}
