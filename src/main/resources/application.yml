spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/banking}
    username: ${DATABASE_USER:banking}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 5000
      validation-timeout: 3000
      max-lifetime: 1800000
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration,classpath:db/postgresql
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
server:
  shutdown: graceful
  max-http-request-header-size: 16KB
  tomcat:
    connection-timeout: 5s
    keep-alive-timeout: 20s
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
fineract:
  enabled: ${FINERACT_ENABLED:false}
  url: ${FINERACT_URL:https://localhost:8443/fineract-provider/api/v1}
  tenant: ${FINERACT_TENANT:default}
  username: ${FINERACT_USERNAME:}
  password: ${FINERACT_PASSWORD:}
banking:
  security:
    issuer: ${JWT_ISSUER_URI:}
    jwk-set-uri: ${JWT_JWK_SET_URI:}
    audience: ${JWT_AUDIENCE:}
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"
