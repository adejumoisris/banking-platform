name: Java CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: banking_test
          POSTGRES_USER: banking_test
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U banking_test -d banking_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/banking_test
      TEST_DATABASE_DRIVER: org.postgresql.Driver
      TEST_DATABASE_USER: banking_test
      TEST_DATABASE_PASSWORD: ci-only-password
      TEST_FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/postgresql
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: target/surefire-reports
